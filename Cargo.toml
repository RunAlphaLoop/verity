[workspace]
members = [
    "crates/verity-core",
    "crates/verity-storage",
    "crates/verity-server",
    "crates/verity-bench",
    "crates/verity-encoder",
    "crates/verity-mcp",
    "crates/verity-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/verity/verity"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# serde_yaml is archived (RUSTSEC-2024-0320); serde_yaml_ng is the maintained,
# API-compatible fork.
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roaring = "0.10"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_distr = "0.5"
hdrhistogram = "7"
moka = { version = "0.12", features = ["sync"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
ort = "2.0.0-rc.12"
tokenizers = "0.23"
hf-hub = "0.5"
rmcp = { version = "2.2", features = ["schemars", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
schemars = { version = "1", features = ["chrono04"] }
