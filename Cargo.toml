[workspace]
members = [
    "crates/verity-core",
    "crates/verity-storage",
    "crates/verity-storage-qdrant",
    "crates/verity-server",
    "crates/verity-bench",
    "crates/verity-encoder",
    "crates/verity-mcp",
    "crates/verity-cli",
    "crates/verity-manifest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/RunAlphaLoop/verity"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# serde_yaml is archived (RUSTSEC-2024-0320); serde_yaml_ng is the maintained,
# API-compatible fork.
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roaring = "0.10"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_distr = "0.5"
hdrhistogram = "7"
moka = { version = "0.12", features = ["sync"] }
# Media object-store seam (task 47): S3/MinIO/GCS/local behind one async trait.
# Chosen over aws-sdk-s3 for the lighter dep tree and multi-backend support.
object_store = { version = "0.14", features = ["aws"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Secret-intake redaction (Phase 2): pasted connector secrets are wrapped in a
# masking newtype that zeroizes its bytes on drop so key material never lingers
# in freed memory. `zeroize_derive` is unused — we hand-roll Drop on the wrapper.
zeroize = "1.9"
rand_core = { version = "0.6", features = ["getrandom"] }
ort = "2.0.0-rc.12"
tokenizers = "0.23"
hf-hub = "0.5"
rmcp = { version = "2.2", features = ["schemars", "transport-io"] }
# Tier-1 file extraction (POST /v1/files): Rust-native, deterministic, no OCR.
# calamine: xlsx/xls/xlsb/ods sheet text, pure Rust, magic-byte autodetection.
calamine = "0.36"
# zip + quick-xml: pptx is a zip of XML; we pull a:t runs ourselves — no
# heavyweight office suite dep. deflate-read only; fixtures are written Stored.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41"
# cfb: legacy .doc is an OLE2 compound file; we read its WordDocument + table
# streams and reconstruct text from the piece table ourselves (no office suite).
cfb = "0.10"
# pdf-extract: text-layer extraction (fonts/ToUnicode CMaps/ordering) on top of
# lopdf — the part we refuse to reimplement. Known to panic on hostile files;
# every call is wrapped in catch_unwind (see extract.rs).
pdf-extract = "0.12"
# OCR tier (ocr.rs): ocrs + rten — pure-Rust OCR. No tesseract or any system
# dependency (that would break the clean-VM stranger gate), no cloud OCR.
# Models (~12 MB total) download once from the ocrs project's canonical bucket
# into ~/.cache/ocrs — the same fetch-once-then-cache lane as the MiniLM
# encoder (which uses the hf-hub default cache). rten must track the exact
# version the ocrs release depends on, or Model types won't line up.
ocrs = "0.12"
rten = "0.24"
# image: PNG/JPEG decode for standalone image OCR and embedded PDF images,
# plus JPEG *encoding* in test fixtures. Decode-only features, pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# lopdf: pinned to the same version pdf-extract already compiles, so walking a
# scanned PDF's page/image tree reuses the one PDF parser in the tree.
lopdf = "0.42"
# ureq: blocking OCR-model download (extraction is synchronous code); already
# in the tree transitively via hf-hub.
ureq = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
schemars = { version = "1", features = ["chrono04"] }
# Local-folder watching (folder_watch.rs): cross-platform FS events
# (FSEvents/inotify/ReadDirectoryChangesW) with a settle-debouncer so editor
# write bursts and mid-write partials fire once, after the file is quiescent.
notify = "6"
notify-debouncer-full = "0.3"

# OCR inference is numeric hot-loop work; unoptimized rten is ~50x slower,
# which makes dev-profile scanned-PDF ingestion (and the VERITY_OCR_E2E test)
# crawl. Optimizing JUST the rten family in dev keeps `cargo build` fast for
# our own code while making local OCR usable. Release builds are unaffected.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
