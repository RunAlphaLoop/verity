[workspace]
members = [
    "crates/verity-core",
    "crates/verity-storage",
    "crates/verity-server",
    "crates/verity-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/verity/verity"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
roaring = "0.10"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_distr = "0.5"
hdrhistogram = "7"
