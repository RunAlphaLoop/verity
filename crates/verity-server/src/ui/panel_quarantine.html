<!-- ==========================================================================
     panel_quarantine.html — Quarantine  [v2 rebuild — frozen design contract]
     --------------------------------------------------------------------------
     The fail-closed queue, made humane. Every item is a card that says
     "Verity refused to index this — here is why" in plain language, with the
     verbatim reason and full payload as secondary evidence. Backed by
     GET /v1/admin/quarantine (admin token).

     The two ONLY exits (kept, both audited; migration 0023):
       POST /v1/admin/quarantine/{id}/reingest — re-admit THROUGH a corrected,
         admin-supplied mapping (visibility + confidentiality REQUIRED and
         explicit; stamped admin-assigned; original payload preserved verbatim)
       POST /v1/admin/quarantine/{id}/dismiss — acknowledge, index NOTHING.
     There is, and will be, NO "index it anyway" affordance — no request shape
     exists that indexes a payload under its original unmappable ACL or any
     default (SPEC §3, §5 Screen 6, §7b). The row survives either exit.

     v2: autoloads once the tenant is known; cards, not table rows; the
     re-ingest dialog names principals from the tenant directory (N5) so the
     corrected mapping is picked by name, not guessed by token number.

     OWNS: this file + panel_quarantine.js. Same panel id ("quarantine") +
     mount id (#quarantine-mount) + Verity.register shape as v1.
     ========================================================================== -->
<section class="panel" id="panel-quarantine">
  <h1>Quarantine</h1>
  <div class="lede"><b>Verity refused to index these, on purpose.</b> When a payload arrives with permissions &mdash; who can see it (visibility) &mdash; that Verity cannot verify, it is refused &mdash; never guessed into the index &mdash; and waits here for the person carrying the keyring to fix the permissions or dismiss it.</div>
  <div id="quarantine-mount"></div>
</section>
