<!-- ==========================================================================
     panel_knowledge.html — Knowledge review (v2 rebuild, UI-ACTIONS §5)
     --------------------------------------------------------------------------
     Lessons Verity has learned across customers, rendered as readable lesson
     cards with a plain-language lifecycle (proposed → gathering support →
     awaiting your review → published). Reads:
       • GET /v1/knowledge?tenant_id[&status]     — the queue (admin-token)
       • GET /v1/admin/knowledge/{id}?tenant_id   — one lesson's full story
       • GET /v1/admin/principals?tenant_id       — NAMED people & groups for
         the publish dialog (N5 — no more raw-int guesswork)
     Human-gated writes (the gates survive verbatim):
       • POST /v1/knowledge/{id}/publish — visibility REQUIRED, no default;
         omission refuses; k_min clamped ≥3 (server is the authority)
       • POST /v1/admin/knowledge/{id}/reject — reason REQUIRED here;
         remembered so the same lesson never resurrects
     There is still NO un-publish endpoint — the retraction seam stays honest
     and disabled. Exact support counts stay on this admin surface; agents only
     ever see a coarse bucket (provenance firewall).

     Owns ONLY this file + panel_knowledge.js. Same panel id, mount id, and
     Verity.register shape as v1 so wiring holds. Mounts into #knowledge-mount.
     ========================================================================== -->

  <h1>Knowledge review</h1>
  <div class="lede">Lessons Verity has learned across customers wait here for a person to publish or reject them — nothing is ever published automatically.</div>

</section>
