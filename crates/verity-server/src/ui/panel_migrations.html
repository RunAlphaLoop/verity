<!-- ==========================================================================
     panel_migrations.html — Search index upgrade (v2 rebuild, frozen contract)
     --------------------------------------------------------------------------
     The embedding-model migration + backfill cockpit, in plain words. Four
     operations, each with a one-sentence purpose, all wired to endpoints that
     exist server-side (verified in main.rs + backfill.rs):

       • POST /v1/admin/reembed/batch   — "Rebuild the search index":
         { model, tenant?, batch } → { model, scanned, written,
         coverage:{total,covered,fraction}, done }. Looped client-side;
         coverage repainted from the live server number after every batch.
         503 on a sparse-only server, surfaced verbatim.
       • GET  /v1/admin/backfill?tenant_id= — "Source history backfill":
         latest run per source; AUTO-LOADED once the tenant is known.
       • POST /v1/admin/reembed/cutover — "Switch searches to the new index":
         { tenant?, route, force } — COVERAGE-GATED (409 below 100% unless
         force). The v1 rollback is the un-gated inverse.
       • POST /v1/admin/briefs/refresh?tenant= — "Refresh entity summaries".

     Honesty contract kept verbatim:
       • determinate bars ONLY when a total is known; striped indeterminate
         otherwise — never a fabricated percentage; total==0 is its own state;
       • ETA only for a running job with a known total and forward progress;
       • the LIVE dense route has no GET endpoint — this screen shows only a
         route it flipped itself this session and says "unknown" otherwise;
       • coverage is unmeasured until a batch runs (no read-only coverage
         endpoint) — disclosed, never guessed;
       • force-cutover requires an explicit acknowledgment; omission refuses
         client-side rather than firing a doomed POST.

     Owns ONLY this file + panel_migrations.js. Same panel id
     (#panel-migrations) + mount id (#migrations-mount) + Verity.register
     shape as v1 — wiring holds.
     ========================================================================== -->
<section class="panel" id="panel-migrations">
  <h1>Search index upgrade</h1>
  <div class="lede">Rebuild the search index under a new embedding model, watch real progress per source, and switch queries over only once coverage has earned it.</div>
  <div id="migrations-mount"></div>
</section>
