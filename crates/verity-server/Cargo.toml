[package]
name = "verity-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "verity"
path = "src/main.rs"

[dependencies]
verity-core = { path = "../verity-core" }
verity-encoder = { path = "../verity-encoder" }
verity-storage = { path = "../verity-storage" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand_core = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# ReBAC plane (task 10): SpiceDB HTTP-gateway client + revocation cache.
reqwest = { workspace = true }
moka = { workspace = true }
# SSE subscriptions (task 21): poll-loop event streams.
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
