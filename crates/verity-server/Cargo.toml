[package]
name = "verity-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "verity"
path = "src/main.rs"

[dependencies]
verity-core = { path = "../verity-core" }
verity-encoder = { path = "../verity-encoder" }
verity-manifest = { path = "../verity-manifest" }
verity-storage = { path = "../verity-storage" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sqlx = { workspace = true }
# Consolidation plane: knowledge statement embeddings bound into merge SQL.
pgvector = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand_core = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# ReBAC plane (task 10): SpiceDB HTTP-gateway client + revocation cache.
# "stream" powers the incremental /v1/watch consumer (rebac_watch.rs).
reqwest = { workspace = true, features = ["stream"] }
moka = { workspace = true }
# Media object-store seam (task 47): S3/MinIO blob tier behind object_store.
object_store = { workspace = true }
bytes = "1"
# Tier-1 file extraction (extract.rs): PDF/PPTX/XLS(X) → text, deterministic,
# no OCR. Dep choices justified at the workspace root Cargo.toml.
calamine = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
pdf-extract = { workspace = true }
# SSE subscriptions (task 21): poll-loop event streams.
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
