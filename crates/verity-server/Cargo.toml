[package]
name = "verity-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "verity"
path = "src/main.rs"

[dependencies]
verity-core = { path = "../verity-core" }
verity-encoder = { path = "../verity-encoder" }
verity-manifest = { path = "../verity-manifest" }
verity-storage = { path = "../verity-storage" }
tokio = { workspace = true }
axum = { workspace = true, features = ["multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sqlx = { workspace = true }
# Consolidation plane: knowledge statement embeddings bound into merge SQL.
pgvector = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# Secret-intake redaction (Phase 2, Secret newtype): zeroize the pasted secret
# on drop; Debug/Display print `***` so a secret can never leak via a log line.
zeroize = { workspace = true }
rand_core = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# ReBAC plane (task 10): SpiceDB HTTP-gateway client + revocation cache.
# "stream" powers the incremental /v1/watch consumer (rebac_watch.rs).
reqwest = { workspace = true, features = ["stream"] }
moka = { workspace = true }
# Media object-store seam (task 47): S3/MinIO blob tier behind object_store.
object_store = { workspace = true }
bytes = "1"
# Tier-1 file extraction (extract.rs): PDF/PPTX/XLS(X)/DOC(X) text layers,
# deterministic. Dep choices justified at the workspace root Cargo.toml.
calamine = { workspace = true }
zip = { workspace = true }
cfb = { workspace = true }
quick-xml = { workspace = true }
pdf-extract = { workspace = true }
# OCR tier (ocr.rs): image decode + scanned-PDF page walking are always built
# (typed failures either way); the ocrs/rten engine itself sits behind the
# default-ON `ocr` feature so `--no-default-features` can shave its compile
# cost — extraction then fails typed ("built without the 'ocr' feature").
image = { workspace = true }
lopdf = { workspace = true }
# Bomb-guarded FlateDecode for embedded PDF images: lopdf's own
# decompressed_content() has no output cap, so ocr.rs inflates manually with
# flate2 + Read::take. Non-optional — the decode path compiles either way.
flate2 = { workspace = true }
ocrs = { workspace = true, optional = true }
rten = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
# SSE subscriptions (task 21): poll-loop event streams.
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Local-folder watching (folder_watch.rs): server-side FS watcher + debounce.
notify = { workspace = true }
notify-debouncer-full = { workspace = true }

[features]
default = ["ocr"]
# Local OCR engine (ocrs + rten). ON by default — sovereignty-first, still
# pure Rust, still zero system deps. Building with --no-default-features
# drops the engine (and its compile time); scanned-PDF/image extraction then
# returns the typed "built without the 'ocr' feature" failure instead.
ocr = ["dep:ocrs", "dep:rten", "dep:ureq"]
