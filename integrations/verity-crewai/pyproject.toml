[project]
name = "verity-crewai"
version = "0.1.0"
description = "Verity StorageBackend for CrewAI unified memory: permission-aware crew memory. Snapshot-grade convenience lane (SPEC §5e.4, §9c)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    # The StorageBackend protocol + MemoryRecord types live in the 1.x
    # unified-memory rewrite (ExternalMemory was removed there); verified
    # against crewai 1.15.2.
    "crewai>=1.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_crewai"]

[tool.ruff]
line-length = 100
