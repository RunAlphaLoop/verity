[project]
name = "verity-openai-agents"
version = "0.1.0"
description = "Verity Session backend for the OpenAI Agents SDK: permission-aware conversation history. Snapshot-grade convenience lane (SPEC §5e.4, §9c)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    # Session is a structural (runtime-checkable) protocol — the dependency
    # pins the contract we implement; verified against openai-agents 0.18.1.
    "openai-agents>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_openai_agents"]

[tool.ruff]
line-length = 100
