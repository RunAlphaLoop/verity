[project]
name = "verity-langgraph"
version = "0.1.0"
description = "Verity BaseStore adapter for LangGraph: permission-aware long-term agent memory. Snapshot-grade convenience lane (SPEC §5e.4)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "langgraph-checkpoint>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_langgraph"]

[tool.ruff]
line-length = 100
