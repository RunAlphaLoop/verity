; Shared pytest config for all integrations packages.
;
; The e2e conformance harness (integrations/e2e/) is marker-gated and
; DESELECTED by default: a plain `pytest` run anywhere under integrations/
; executes only the mock suites. Run the harness via
; `bash integrations/run_e2e.sh` (which passes `-m e2e`, overriding addopts).
[pytest]
markers =
    e2e: framework conformance tests against a live Verity server + Postgres (run via integrations/run_e2e.sh)
addopts = -m "not e2e"
