[project]
name = "verity-langchain"
version = "0.1.0"
description = "Verity sink for LangChain: a permission-aware VectorStore + BaseRetriever destination. Snapshot-grade convenience lane (SPEC §5e.4) — community loaders become de-facto Verity connectors."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "langchain-core>=0.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_langchain"]

[tool.ruff]
line-length = 100
