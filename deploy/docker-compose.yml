services:
  postgres:
    image: paradedb/paradedb:latest-pg17
    container_name: verity-postgres
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity
      POSTGRES_DB: verity
    ports:
      - "5433:5432"
    # Parallel index builds (HNSW especially) allocate maintenance_work_mem in
    # dynamic shared memory; Docker's 64MB default fails them with
    # "could not resize shared memory segment: No space left on device".
    shm_size: 1gb
    volumes:
      - verity-pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=1GB
      -c maintenance_work_mem=512MB
      -c max_parallel_maintenance_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ReBAC engine (SPEC §7a): SpiceDB with the in-memory datastore — dev/v0.1
  # posture; production moves to a Postgres-backed datastore. gRPC on 50051,
  # HTTP gateway on 8443 (the v0.1 Rust client speaks the HTTP gateway; the
  # preshared key is the bearer token on both surfaces).
  spicedb:
    image: authzed/spicedb
    container_name: verity-spicedb
    command: serve --grpc-preshared-key verity-dev-key --http-enabled
    ports:
      - "50051:50051"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SCALE profile serving engine (SPEC §3): Qdrant, filter-aware HNSW.
  # 6334 is the gRPC port the Rust client uses; 6333 is REST/dashboard.
  qdrant:
    image: qdrant/qdrant
    container_name: verity-qdrant
    # Opt-in: not started by a bare `docker compose up`. The default dev/quickstart
    # path serves ANN from pgvector (ParadeDB). Bring this up only for the SCALE
    # engine: `docker compose --profile scale up`.
    profiles: ["scale"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - verity-qdrant:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget; bash /dev/tcp is the documented
      # healthcheck workaround.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ingest-plane orchestration (SPEC §5): Temporal DEV server — the
  # single-binary `temporal server start-dev` from the CLI image, chosen over
  # temporalio/auto-setup because it needs no companion Postgres/Elasticsearch
  # and boots in seconds. State is deliberately ephemeral (in-memory SQLite,
  # no --db-filename, no volume): connector cursors replay safely into keyed
  # L1 upserts, so nothing critical is lost on restart. PRODUCTION NOTE: real
  # deployments run a proper Temporal cluster (self-hosted with a durable
  # Postgres/Cassandra datastore, or Temporal Cloud) — the dev server is
  # single-process, unreplicated, and wipes history on restart by design.
  # See docs/OPERATIONS.md ("Ingest orchestration").
  temporal:
    image: temporalio/temporal:latest
    container_name: verity-temporal
    # Opt-in: not started by a bare `docker compose up`. The serving core (recall,
    # ingest, resolve) runs without it — connector schedules are the only feature
    # that needs it. Bring it up with `docker compose --profile scale up`.
    profiles: ["scale"]
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233" # gRPC (workers, schedules helper)
      - "8233:8233" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Media blob object store (SPEC §10, task 47): MinIO, an S3-compatible
  # server, is the DEV/v0.3 tier for media blobs — the alternative to the
  # dev-grade Postgres `bytea` path. The server writes blobs here when
  # VERITY_MEDIA_S3_ENDPOINT + VERITY_MEDIA_BUCKET are set; unset, it falls
  # back to bytea (see docs/OPERATIONS.md "Media storage").
  #   API   :9000 (S3 protocol — VERITY_MEDIA_S3_ENDPOINT=http://localhost:9000)
  #   Console :9001 (web UI — http://localhost:9001, login minioadmin/minioadmin)
  # PRODUCTION NOTE: real deployments point VERITY_MEDIA_S3_ENDPOINT at
  # AWS S3 / GCS (S3-compat) / Cloudflare R2 with real credentials and TLS —
  # MinIO here is a local stand-in only. Credentials below are dev defaults;
  # never reuse them in production.
  minio:
    image: minio/minio
    container_name: verity-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    volumes:
      - verity-minio:/data
    healthcheck:
      # MinIO ships a /minio/health/live liveness endpoint; the image includes
      # `mc`, but curl is absent, so probe via mc's own ready check.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot bucket bootstrap: waits for MinIO, then creates the default
  # `verity-media` bucket (idempotent — re-running is a no-op). Exits 0.
  # Manual equivalent (if you skip this container):
  #   mc alias set local http://localhost:9000 minioadmin minioadmin
  #   mc mb --ignore-existing local/verity-media
  minio-init:
    image: minio/mc
    container_name: verity-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/verity-media &&
      echo 'bucket verity-media ready'
      "

volumes:
  verity-pgdata:
  verity-qdrant:
  verity-minio:
