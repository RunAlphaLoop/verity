services:
  postgres:
    image: paradedb/paradedb:latest-pg17
    container_name: verity-postgres
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity
      POSTGRES_DB: verity
    ports:
      - "5433:5432"
    # Parallel index builds (HNSW especially) allocate maintenance_work_mem in
    # dynamic shared memory; Docker's 64MB default fails them with
    # "could not resize shared memory segment: No space left on device".
    shm_size: 1gb
    volumes:
      - verity-pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=1GB
      -c maintenance_work_mem=512MB
      -c max_parallel_maintenance_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ReBAC engine (SPEC §7a): SpiceDB with the in-memory datastore — dev/v0.1
  # posture; production moves to a Postgres-backed datastore. gRPC on 50051,
  # HTTP gateway on 8443 (the v0.1 Rust client speaks the HTTP gateway; the
  # preshared key is the bearer token on both surfaces).
  spicedb:
    image: authzed/spicedb
    container_name: verity-spicedb
    command: serve --grpc-preshared-key verity-dev-key --http-enabled
    ports:
      - "50051:50051"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SCALE profile serving engine (SPEC §3): Qdrant, filter-aware HNSW.
  # 6334 is the gRPC port the Rust client uses; 6333 is REST/dashboard.
  qdrant:
    image: qdrant/qdrant
    container_name: verity-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - verity-qdrant:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget; bash /dev/tcp is the documented
      # healthcheck workaround.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ingest-plane orchestration (SPEC §5): Temporal DEV server — the
  # single-binary `temporal server start-dev` from the CLI image, chosen over
  # temporalio/auto-setup because it needs no companion Postgres/Elasticsearch
  # and boots in seconds. State is deliberately ephemeral (in-memory SQLite,
  # no --db-filename, no volume): connector cursors replay safely into keyed
  # L1 upserts, so nothing critical is lost on restart. PRODUCTION NOTE: real
  # deployments run a proper Temporal cluster (self-hosted with a durable
  # Postgres/Cassandra datastore, or Temporal Cloud) — the dev server is
  # single-process, unreplicated, and wipes history on restart by design.
  # See docs/OPERATIONS.md ("Ingest orchestration").
  temporal:
    image: temporalio/temporal:latest
    container_name: verity-temporal
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233" # gRPC (workers, schedules helper)
      - "8233:8233" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  verity-pgdata:
  verity-qdrant:
