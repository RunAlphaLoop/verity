[project]
name = "verity-ingest"
version = "0.1.0"
description = "Verity ingestion plane: connectors, enrichment, extraction. Never on the read path."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Live Google Drive access only (BYOT service-account auth); fixture tests
# and the rest of the ingest plane never import it.
gdrive = ["google-auth>=2.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verity_ingest"]

[tool.ruff]
line-length = 100
